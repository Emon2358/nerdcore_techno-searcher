name: 🔍 Web Archive 検索 & README 更新 (高精度・改善版)

on:
  workflow_dispatch:
    inputs:
      search_term:
        description: 'Web Archive で検索するキーワード'
        required: true
        default: 'github'

jobs:
  search-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. リポジトリのコードをチェックアウト
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # 2. 検索の実行とREADMEのフォーマット
      - name: 🔎 Internet Archive で高精度検索し、結果をフォーマット
        id: search
        shell: bash
        run: |
          # ワークフローの入力から検索語を取得
          SEARCH_TERM="${{ github.event.inputs.search_term }}"
          
          echo "検索キーワード: $SEARCH_TERM"

          # --- 検索クエリを定義 ---
          BASE_URL="https://archive.org/advancedsearch.php"
          
          # 検索クエリ (q=)
          # $SEARCH_TERM (例: "KOB records") は --data-urlencode によってエンコードされる
          QUERY_STRING="(title:($SEARCH_TERM) OR description:($SEARCH_TERM) OR subject:($SEARCH_TERM)) AND mediatype:(web)"
          
          # 取得フィールド (fl[]=)
          FIELDS_VAL="identifier,title,publicdate,description"
          
          # ソート順 (sort[]=)
          # "publicdate desc" のスペースも --data-urlencode が処理する
          SORT_VAL="publicdate desc"

          echo "APIリクエストを送信中..."

          # --- curl を -G と --data-urlencode を使って実行 ---
          # これにより、スペースや特殊文字が自動的にURLエンコードされる
          curl -Ls -G "$BASE_URL" \
            --data-urlencode "q=$QUERY_STRING" \
            --data-urlencode "fl[]=$FIELDS_VAL" \
            --data-urlencode "sort[]=$SORT_VAL" \
            -d "rows=10" \
            -d "output=json" \
            -o results.json
          
          # curlの終了コードをチェック
          CURL_EXIT_CODE=$?
          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "::error:: curlコマンドが失敗しました。終了コード: $CURL_EXIT_CODE"
            # jq が後続で失敗しないよう、空のJSONを作成
            echo '{"response": {"numFound": 0, "docs": []}}' > results.json
          else
            echo "APIレスポンスを取得しました。"
          fi

          # 3. 検索結果をMarkdown形式に整形
          CONTENT_FILE="results_content.md"
          NUM_FOUND=$(jq '.response.numFound' results.json)

          # --- Markdownコンテンツのヘッダーを作成 ---
          echo "### 🚀 「${SEARCH_TERM}」の検索結果 (新しい順)" > $CONTENT_FILE
          echo "" >> $CONTENT_FILE
          
          if [ "$NUM_FOUND" -gt 0 ]; then
            echo "**総ヒット数: $NUM_FOUND 件** (うち上位10件を表示)" >> $CONTENT_FILE
            echo "" >> $CONTENT_FILE
            
            # --- jqを使ってJSONをMarkdown形式に変換 ---
            jq -r '.response.docs[] | 
              "#### [\((.title // "タイトルなし"))](\(https://archive.org/details/.identifier))\n" + 
              "> *公開日: \((.publicdate[0:10] // "不明"))*\n" +
              "> \((.description[0] // "説明なし") | if length > 150 then .[0:150] + "..." else . end | gsub("\n"; " "))\n"' results.json >> $CONTENT_FILE
              
          else
            echo "「$SEARCH_TERM」に一致する結果は見つかりませんでした。" >> $CONTENT_FILE
          fi
          
          echo "" >> $CONTENT_FILE
          echo "---" >> $CONTENT_FILE
          echo "_最終更新: $(date -u +'%Y-%m-%d %H:%M:%S UTC')_" >> $CONTENT_FILE

          # 4. README.md のプレースホルダー間を置換
          echo "READMEファイルを更新します..."
          README_FILE="README.md"
          TEMP_README="README.tmp"
          START_TAG=""
          END_TAG=""

          # csplitを使ってREADMEを分割
          csplit -s -z "$README_FILE" "/$START_TAG/" "/$END_TAG/+1" -f "readme_part_"
          
          # 分割したファイルを使ってREADMEを再構築
          cat readme_part_00 > "$TEMP_README"
          echo "$START_TAG" >> "$TEMP_README"
          cat "$CONTENT_FILE" >> "$TEMP_README" # 新しいコンテンツを挿入
          echo "$END_TAG" >> "$TEMP_README"
          cat readme_part_02 >> "$TEMP_README"
          
          # 元のREADMEを置き換える
          mv "$TEMP_README" "$README_FILE"
          
          # 一時ファイルを削除
          rm readme_part_* results.json $CONTENT_FILE

      # 3. 変更をリポジトリにコミット
      - name: 変更をコミット
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if ! git diff --quiet README.md; then
            echo "README.mdに変更がありました。コミットします。"
            git add README.md
            git commit -m "docs(readme): Web Archive 検索結果を更新" -m "検索ワード: ${{ github.event.inputs.search_term }}"
            git push
          else
            echo "README.mdに変更はありませんでした。"
          fi
