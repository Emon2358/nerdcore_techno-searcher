name: 🔍 Web Archive 検索 & README 更新 (最終改善版)

on:
  workflow_dispatch:
    inputs:
      search_term:
        description: 'Web Archive で検索するキーワード'
        required: true
        default: 'github'

jobs:
  search-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. リポジトリのコードをチェックアウト
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # 2. 検索の実行とREADMEのフォーマット
      - name: 🔎 Internet Archive で高精度検索し、結果をフォーマット
        id: search
        shell: bash
        run: |
          SEARCH_TERM="${{ github.event.inputs.search_term }}"
          echo "検索キーワード: $SEARCH_TERM"

          BASE_URL="https://archive.org/advancedsearch.php"
          QUERY_STRING="(title:($SEARCH_TERM) OR description:($SEARCH_TERM) OR subject:($SEARCH_TERM)) AND mediatype:(web)"
          FIELDS_VAL="identifier,title,publicdate,description"
          SORT_VAL="publicdate desc"

          echo "APIリクエストを送信中..."

          # curl を -G と --data-urlencode を使って安全に実行
          curl -Ls -G "$BASE_URL" \
            --data-urlencode "q=$QUERY_STRING" \
            --data-urlencode "fl[]=$FIELDS_VAL" \
            --data-urlencode "sort[]=$SORT_VAL" \
            -d "rows=10" \
            -d "output=json" \
            -o results.json
          
          CURL_EXIT_CODE=$?
          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "::error:: curlコマンドが失敗しました。終了コード: $CURL_EXIT_CODE"
            echo '{"response": {"numFound": 0, "docs": []}}' > results.json
          else
            echo "APIレスポンスを取得しました。"
          fi

          # 3. 検索結果をMarkdown形式に整形
          CONTENT_FILE="results_content.md"
          NUM_FOUND=$(jq '.response.numFound' results.json)

          echo "### 🚀 「${SEARCH_TERM}」の検索結果 (新しい順)" > $CONTENT_FILE
          echo "" >> $CONTENT_FILE
          
          if [ "$NUM_FOUND" -gt 0 ]; then
            echo "**総ヒット数: $NUM_FOUND 件** (うち上位10件を表示)" >> $CONTENT_FILE
            echo "" >> $CONTENT_FILE
            
            jq -r '.response.docs[] | 
              "#### [\((.title // "タイトルなし"))](\(https://archive.org/details/.identifier))\n" + 
              "> *公開日: \((.publicdate[0:10] // "不明"))*\n" +
              "> \((.description[0] // "説明なし") | if length > 150 then .[0:150] + "..." else . end | gsub("\n"; " "))\n"' results.json >> $CONTENT_FILE
              
          else
            echo "「$SEARCH_TERM」に一致する結果は見つかりませんでした。" >> $CONTENT_FILE
          fi
          
          echo "" >> $CONTENT_FILE
          echo "---" >> $CONTENT_FILE
          echo "_最終更新: $(date -u +'%Y-%m-%d %H:%M:%S UTC')_" >> $CONTENT_FILE

          # 4. README.md のプレースホルダー間を置換 (awk を使用した堅牢な方法)
          echo "READMEファイルを更新します..."
          README_FILE="README.md"
          TEMP_README="README.tmp"

          # --- エラー修正箇所 ---
          # csplit と cat の代わりに awk を使用し、タグ間の内容を置換
          awk -v content_file="$CONTENT_FILE" '
              BEGIN {
                  start_tag = ""
                  end_tag = ""
                  skip = 0
              }
              # 終了タグを見つけたら、skipを解除してタグ自身を出力
              $0 ~ end_tag {
                  skip = 0
                  print $0
                  next
              }
              # 開始タグを見つけたら、タグ自身を出力
              # その後、新しいコンテンツ (results_content.md) の中身を全て出力
              # 最後に skip をセット
              $0 ~ start_tag {
                  print $0
                  while ( (getline line < content_file) > 0 ) {
                      print line
                  }
                  close(content_file)
                  skip = 1
                  next
              }
              # skipがセットされていない場合のみ、現在の行を出力
              skip == 0 {
                  print $0
              }
          ' "$README_FILE" > "$TEMP_README"
          # --- エラー修正ここまで ---

          # 元のREADMEを置き換える
          mv "$TEMP_README" "$README_FILE"
          
          # 一時ファイルを削除
          rm results.json $CONTENT_FILE

      # 5. 変更をリポジトリにコミット
      - name: 変更をコミット
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if ! git diff --quiet README.md; then
            echo "README.mdに変更がありました。コミットします。"
            git add README.md
            git commit -m "docs(readme): Web Archive 検索結果を更新" -m "検索ワード: ${{ github.event.inputs.search_term }}"
            git push
          else
            echo "README.mdに変更はありませんでした。"
          fi
